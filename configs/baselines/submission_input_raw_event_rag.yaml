baseline:
  name: submission_input_raw_event_rag
  family: no_gold_submission_input
  description: Deterministic raw-event RAG over exported no-gold submission inputs, producing ProjectPrediction JSONL.
  entrypoint: ultra_long_benchmark.cli:run-submission-input-baseline
  requires_llm_api: false
  requires_gpu: false
  memory_backend: none
data:
  project_dir: examples/generated/release_packaging/project_benchmark
  submission_input_dir: examples/generated/evaluation_harness/project_submission_inputs
  predictions_path: examples/generated/evaluation_harness/submission_input_raw_event_rag_predictions.jsonl
  output_path: examples/generated/evaluation_harness/submission_input_raw_event_rag_report.json
evaluation:
  mode: submission_input_prediction_generation
  baseline: raw_event_rag_input
  top_k: 5
  metrics:
    - predictions_written
    - retrieved_events_total
    - no_gold_input_contract
resources:
  partition: cpu
  gpus: 0
  cpus_per_task: 2
  mem: 8G
  time: "00:20:00"
reproducibility:
  seed: 0
  deterministic: true
  notes: Generates predictions only from exported submission inputs; score with score-project-release-predictions.
