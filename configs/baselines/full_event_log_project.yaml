baseline:
  name: full_event_log_project
  family: long_context_ablation
  description: Chronological raw event-log baseline without induced policy memory or verifier-provided labels.
  entrypoint: ultra_long_benchmark.cli:evaluate-project
  requires_llm_api: false
  requires_gpu: false
  memory_backend: full_raw_log
data:
  project_dir: examples/generated/projects/project_gharchive_001
  output_path: examples/generated/evaluation_harness/full_event_log_project_gharchive.json
evaluation:
  mode: project_probe_text
  top_k: 0
  baselines:
    - full_event_log
  metrics:
    - must_include_recall
    - must_not_violation_rate
    - evidence_recall
    - boundary_action_recall
resources:
  partition: cpu
  gpus: 0
  cpus_per_task: 2
  mem: 8G
  time: "00:20:00"
reproducibility:
  seed: 0
  deterministic: true
  notes: Tests whether raw longitudinal context alone exposes the needed policy/action boundary.
