baseline:
  name: gharchive_action_trace_scoring
  family: trace_scorer
  description: Deterministic scoring of concrete GHArchive tool-action traces against action boundaries.
  entrypoint: ultra_long_benchmark.cli:score-action-traces
  requires_llm_api: false
  requires_gpu: false
  memory_backend: none
data:
  project_dir: examples/generated/projects/project_gharchive_001
  traces_path: examples/action_traces/gharchive_trace_examples.jsonl
  output_path: examples/generated/evaluation_harness/gharchive_action_trace_report.json
evaluation:
  mode: project_probe_action_trace
  metrics:
    - trace_boundary_violation_rate
    - allowed_action_coverage
    - missing_approval
    - missing_clarification
resources:
  partition: cpu
  gpus: 0
  cpus_per_task: 2
  mem: 8G
  time: "00:20:00"
reproducibility:
  seed: 0
  deterministic: true
  notes: Runs without network access and without model weights.
