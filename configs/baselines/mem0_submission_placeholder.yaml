baseline:
  name: mem0_submission_placeholder
  family: memory_system
  description: Gated Mem0 adapter placeholder for the no-gold LongUserPolicyBench submission contract.
  entrypoint: ultra_long_benchmark.cli:run-memory-submission-baseline
  requires_llm_api: true
  requires_gpu: true
  memory_backend: mem0
data:
  project_dir: examples/generated/release_packaging/gharchive_formal_project_benchmark
  submission_input_dir: examples/generated/evaluation_harness/gharchive_formal_submission_inputs_hardened
  predictions_path: examples/generated/evaluation_harness/gharchive_formal_mem0_prompt_adapter_predictions.jsonl
  output_path: examples/generated/evaluation_harness/gharchive_formal_mem0_prompt_adapter_report.json
evaluation:
  mode: memory_submission_prediction_generation
  adapter: mem0
  top_k: 8
  provider_config_path: opencode.json
  model: gpt-5.4-mini
  max_output_tokens: 512
  request_timeout: 60
  max_retries: 3
  retry_backoff_seconds: 2
  metrics:
    - project_release_micro_pass_rate
    - evidence_recall
    - boundary_action_recall
    - diagnostic_label_counts
resources:
  partition: RTX4090
  gpus: 1
  cpus_per_task: 8
  mem: 48G
  time: "04:00:00"
reproducibility:
  seed: 0
  deterministic: false
  notes: Uses the hardened no-gold input pack. With --allow-llm-api, runs an OpenAI-compatible Mem0-style prompt adapter against gpt-5.4-mini and emits ProjectPrediction JSONL; it does not import the upstream Mem0 package.
environment:
  required:
    - OPENAI_API_KEY
  optional:
    - ULB_OPENAI_BASE_URL
    - HF_HOME=/data1/public/hf
