baseline:
  name: oracle_policy_graph
  family: oracle
  description: Upper-bound sanity baseline using gold policy graph, action boundaries, and source evidence.
  entrypoint: ultra_long_benchmark.cli:evaluate-project
  requires_llm_api: false
  requires_gpu: false
  memory_backend: gold_memory_graph
data:
  project_dir: examples/generated/projects/project_manual_001
  output_path: examples/generated/evaluation_harness/project_manual_baselines.json
evaluation:
  mode: project_probe_text
  top_k: 3
  baselines:
    - oracle_policy_graph
  metrics:
    - must_include_recall
    - must_not_violation_rate
    - evidence_recall
    - boundary_action_recall
resources:
  partition: cpu
  gpus: 0
  cpus_per_task: 2
  mem: 8G
  time: "00:20:00"
reproducibility:
  seed: 0
  deterministic: true
  notes: Included as an upper bound, not as a deployable memory method.
