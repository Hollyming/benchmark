baseline:
  name: a_mem_project
  family: memory_system
  description: Placeholder config for A-MEM-style project probe evaluation once the runner is installed.
  entrypoint: scripts/run_memory_baseline.py:a_mem
  requires_llm_api: true
  requires_gpu: true
  memory_backend: a_mem
data:
  project_dir: examples/generated/projects/project_gharchive_001
  output_path: examples/generated/evaluation_harness/a_mem_project_gharchive.json
evaluation:
  mode: project_probe_action_trace
  top_k: 8
  metrics:
    - policy_action_accuracy
    - boundary_violation_rate
    - evidence_recall
    - trace_boundary_violation_rate
resources:
  partition: RTX4090
  gpus: 1
  cpus_per_task: 8
  mem: 48G
  time: "04:00:00"
reproducibility:
  seed: 0
  deterministic: false
  notes: Requires provider/model configuration and A-MEM runner before execution.
environment:
  required:
    - OPENAI_API_KEY
  optional:
    - HF_HOME=/data1/public/hf
