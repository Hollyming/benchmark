baseline:
  name: temporal_raw_rag_project
  family: retrieval
  description: Deterministic raw-event retrieval with recency and policy-update bonuses, but no gold memory graph.
  entrypoint: ultra_long_benchmark.cli:evaluate-project
  requires_llm_api: false
  requires_gpu: false
  memory_backend: none
data:
  project_dir: examples/generated/projects/project_gharchive_001
  output_path: examples/generated/evaluation_harness/temporal_raw_rag_project_gharchive.json
evaluation:
  mode: project_probe_text
  top_k: 3
  baselines:
    - temporal_raw_rag
  metrics:
    - must_include_recall
    - must_not_violation_rate
    - evidence_recall
    - boundary_action_recall
resources:
  partition: cpu
  gpus: 0
  cpus_per_task: 2
  mem: 8G
  time: "00:20:00"
reproducibility:
  seed: 0
  deterministic: true
  notes: Recency-aware retrieval ablation for policy updates, exceptions, and stale-memory stressors.
