baseline:
  name: no_memory_project
  family: ablation
  description: No persistent memory or event retrieval; asks for clarification around user-specific policy actions.
  entrypoint: ultra_long_benchmark.cli:evaluate-project
  requires_llm_api: false
  requires_gpu: false
  memory_backend: none
data:
  project_dir: examples/generated/projects/project_gharchive_001
  output_path: examples/generated/evaluation_harness/no_memory_project_gharchive.json
evaluation:
  mode: project_probe_text
  top_k: 0
  baselines:
    - no_memory
  metrics:
    - must_include_recall
    - must_not_violation_rate
    - evidence_recall
    - boundary_action_recall
resources:
  partition: cpu
  gpus: 0
  cpus_per_task: 2
  mem: 8G
  time: "00:20:00"
reproducibility:
  seed: 0
  deterministic: true
  notes: Lower-bound ablation that never reads user history or gold policy memories.
