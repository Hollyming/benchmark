baseline:
  name: graphiti_submission_placeholder
  family: memory_system
  description: Gated Zep/Graphiti-style temporal-KG adapter placeholder for the no-gold LongUserPolicyBench submission contract.
  entrypoint: ultra_long_benchmark.cli:run-memory-submission-baseline
  requires_llm_api: true
  requires_gpu: false
  memory_backend: graphiti
data:
  project_dir: examples/generated/release_packaging/gharchive_formal_project_benchmark
  submission_input_dir: examples/generated/evaluation_harness/gharchive_formal_submission_inputs_hardened
  predictions_path: examples/generated/evaluation_harness/gharchive_formal_graphiti_prompt_adapter_predictions.jsonl
  output_path: examples/generated/evaluation_harness/gharchive_formal_graphiti_prompt_adapter_report.json
evaluation:
  mode: memory_submission_prediction_generation
  adapter: graphiti
  top_k: 8
  provider_config_path: opencode.json
  model: gpt-5.4-mini
  max_output_tokens: 512
  request_timeout: 60
  max_retries: 3
  retry_backoff_seconds: 2
  metrics:
    - project_release_micro_pass_rate
    - evidence_recall
    - boundary_action_recall
    - diagnostic_label_counts
resources:
  partition: cpu
  gpus: 0
  cpus_per_task: 8
  mem: 32G
  time: "04:00:00"
reproducibility:
  seed: 0
  deterministic: false
  notes: Uses the hardened no-gold input pack. With --allow-llm-api, runs an OpenAI-compatible Graphiti-style prompt adapter against gpt-5.4-mini and emits ProjectPrediction JSONL; it does not import Graphiti or require Neo4j.
environment:
  required:
    - OPENAI_API_KEY
  optional:
    - ULB_OPENAI_BASE_URL
    - NEO4J_URI
    - NEO4J_USER
    - NEO4J_PASSWORD
